<svg width="1200" height="630" viewBox="0 0 1200 630" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0a0f"/>
      <stop offset="100%" stop-color="#0f1729"/>
    </linearGradient>
    <radialGradient id="glow1" cx="20%" cy="30%" r="50%">
      <stop offset="0%" stop-color="#34d399" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#34d399" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glow2" cx="85%" cy="80%" r="55%">
      <stop offset="0%" stop-color="#22d3ee" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#22d3ee" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="titleGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#34d399"/>
      <stop offset="50%" stop-color="#22d3ee"/>
      <stop offset="100%" stop-color="#3b82f6"/>
    </linearGradient>
    <linearGradient id="badgeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34d399"/>
      <stop offset="100%" stop-color="#22d3ee"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bgGrad)"/>
  <rect width="1200" height="630" fill="url(#glow1)"/>
  <rect width="1200" height="630" fill="url(#glow2)"/>

  <!-- Grid pattern -->
  <g opacity="0.04" stroke="#ffffff" stroke-width="1">
    <path d="M0 100 H1200 M0 200 H1200 M0 300 H1200 M0 400 H1200 M0 500 H1200"/>
    <path d="M100 0 V630 M200 0 V630 M300 0 V630 M400 0 V630 M500 0 V630 M600 0 V630 M700 0 V630 M800 0 V630 M900 0 V630 M1000 0 V630 M1100 0 V630"/>
  </g>

  <!-- BM badge top-left -->
  <g transform="translate(80, 80)">
    <rect width="64" height="64" rx="14" fill="url(#badgeGrad)"/>
    <text x="32" y="44" text-anchor="middle" font-family="system-ui, sans-serif" font-size="28" font-weight="800" fill="#0a0a0f">BM</text>
  </g>
  <text x="162" y="123" font-family="system-ui, sans-serif" font-size="22" font-weight="600" fill="#ffffff">Babak Milani</text>

  <!-- Status badge -->
  <g transform="translate(80, 200)">
    <rect width="280" height="40" rx="20" fill="#34d399" fill-opacity="0.1" stroke="#34d399" stroke-opacity="0.3"/>
    <circle cx="22" cy="20" r="5" fill="#34d399"/>
    <text x="40" y="26" font-family="system-ui, sans-serif" font-size="15" fill="#34d399">Available for opportunities</text>
  </g>

  <!-- Main heading -->
  <text x="80" y="330" font-family="system-ui, sans-serif" font-size="76" font-weight="800" fill="#ffffff" letter-spacing="-2">Full-Stack &amp;</text>
  <text x="80" y="420" font-family="system-ui, sans-serif" font-size="76" font-weight="800" fill="url(#titleGrad)" letter-spacing="-2">AI Developer</text>

  <!-- Subtitle -->
  <text x="80" y="485" font-family="system-ui, sans-serif" font-size="24" fill="#94a3b8">Shipping production AI-powered SaaS, end-to-end.</text>

  <!-- Tech stack tags -->
  <g font-family="system-ui, sans-serif" font-size="14" fill="#cbd5e1">
    <g transform="translate(80, 530)">
      <rect width="80" height="32" rx="6" fill="#ffffff" fill-opacity="0.05" stroke="#ffffff" stroke-opacity="0.1"/>
      <text x="40" y="21" text-anchor="middle">React</text>
    </g>
    <g transform="translate(170, 530)">
      <rect width="100" height="32" rx="6" fill="#ffffff" fill-opacity="0.05" stroke="#ffffff" stroke-opacity="0.1"/>
      <text x="50" y="21" text-anchor="middle">React Native</text>
    </g>
    <g transform="translate(280, 530)">
      <rect width="80" height="32" rx="6" fill="#ffffff" fill-opacity="0.05" stroke="#ffffff" stroke-opacity="0.1"/>
      <text x="40" y="21" text-anchor="middle">Python</text>
    </g>
    <g transform="translate(370, 530)">
      <rect width="120" height="32" rx="6" fill="#ffffff" fill-opacity="0.05" stroke="#ffffff" stroke-opacity="0.1"/>
      <text x="60" y="21" text-anchor="middle">Claude AI API</text>
    </g>
    <g transform="translate(500, 530)">
      <rect width="120" height="32" rx="6" fill="#ffffff" fill-opacity="0.05" stroke="#ffffff" stroke-opacity="0.1"/>
      <text x="60" y="21" text-anchor="middle">AWS / GCP</text>
    </g>
  </g>

  <!-- URL bottom-right -->
  <text x="1120" y="595" text-anchor="end" font-family="system-ui, sans-serif" font-size="16" fill="#64748b">babakmilani.com</text>
</svg>
